name: CI/CD
on:
  push:
    branches:
      - 'main'

jobs:
  # Path Filtering
  filter-paths:
    name: Filter Paths
    runs-on: ubuntu-latest
    outputs:
      vm-manager: ${{ steps.filter.outputs.vm-manager }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            vm-manager:
              - 'vm-manager/**'
              - '!(vm-manager)/**/*.md'
  
  # START: VM-Manager
  vm-manager-lint-typecheck:
    name: 'VM-Manager: Lint & Type Check'
    runs-on: ubuntu-latest
    needs: filter-paths
    if: needs.filter-paths.outputs.vm-manager == 'true'
    permissions:
      checks: write
      pull-requests: read
      contents: read
    defaults:
      run:
        working-directory: vm-manager
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Nodejs Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: 'vm-manager/yarn.lock'
      - name: Install Dependencies
        run: yarn --frozen-lockfile
      - name: Lint
        run: yarn lint:nofix --output-file eslint_report.json --format json
        continue-on-error: true
      - name: Type Check
        run: yarn tsc --noEmit > typescript.log
        continue-on-error: true
      - name: Annotate Code
        uses: DerLev/eslint-annotations@v2
        with:
          eslint-report: vm-manager/eslint_report.json
          typescript-log: vm-manager/typescript.log
          github-token: ${{ secrets.GITHUB_TOKEN }}
          error-on-warn: true
          status-check-name: 'VM-Manager: Annotations'
          fail-in-pr: false
          add-notice-with-url: false

  vm-manager-build-deploy:
    name: "VM-Manager: Build Container & Upload to ghcr.io"
    runs-on: ubuntu-latest
    needs: [vm-manager-lint-typecheck]
    permissions:
      contents: read
      packages: write
    environment: "VM-Manager: production"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derlev/spawnpoint-vm-manager
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: vm-manager/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # END: VM-Manager
